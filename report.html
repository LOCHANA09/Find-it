<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Report an item | FindIt</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head>
<body><header class="topbar"><a class="brand" href="index.html">⌕ FindIt</a><nav><a href="index.html">Browse items</a></nav></header><main class="container form-container"><a class="back-link" href="index.html">← Back to reports</a><h1>Report an item</h1><p class="muted">Share clear details so the right person can recognise the item.</p><div id="form-message" role="status"></div>
<form class="report-form" id="report-form"><label>Report type<select name="item_type" required><option value="Lost">I lost an item</option><option value="Found">I found an item</option></select></label><label>Item name<input name="item_name" maxlength="120" required placeholder="e.g. Blue water bottle"></label><label>Category<select name="category" required><option>Accessories</option><option>Books & Notes</option><option>Electronics</option><option>ID Cards</option><option>Keys</option><option>Bags</option><option>Clothing</option><option>Other</option></select></label><label>Description<textarea name="description" rows="4" required placeholder="Colour, brand, identifying details..."></textarea></label><label>Location<input name="location" maxlength="180" required placeholder="Where was it lost or found?"></label><label>Date (optional)<input type="date" name="item_date"></label><label>Your name<input name="contact_name" maxlength="100" required></label><label>Contact email<input type="email" name="contact_email" maxlength="190" required></label><button type="submit">Submit report</button></form><p class="privacy-note">Demo note: contact details are shown on the item detail page. Use test information for public demos.</p></main><footer>FindIt demo · Built with HTML, CSS, PHP and MySQL</footer></body></html>
