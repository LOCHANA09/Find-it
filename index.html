<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FindIt | Lost & Found</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head>
<body><header class="topbar"><a class="brand" href="index.html">⌕ FindIt</a><nav><a href="index.html">Browse items</a><a class="nav-cta" href="report.html">Report an item</a></nav></header>
<main class="container"><section class="hero"><p class="eyebrow">LOST SOMETHING? FOUND SOMETHING?</p><h1>Help good things find their way back.</h1><p>Browse reports or share details of an item you lost or found.</p><a class="button-link" href="report.html">＋ Create a report</a></section>
<h2 class="section-title">Open reports</h2><form class="filters" id="filters"><label class="sr-only" for="q">Search items</label><input id="q" name="q" type="search" placeholder="Search name, details or location"><label class="sr-only" for="type">Report type</label><select id="type" name="type"><option value="All">Lost and Found</option><option value="Lost">Lost items</option><option value="Found">Found items</option></select><label class="sr-only" for="category">Category</label><select id="category" name="category"><option value="All">All categories</option></select><button type="submit">Filter</button><a class="reset" href="index.html">Reset</a></form>
<div id="message" role="status"></div><section class="item-grid" id="item-grid"><div class="empty">Loading reports…</div></section></main><footer>FindIt demo · Built with HTML, CSS, PHP and MySQL</footer></body></html>
